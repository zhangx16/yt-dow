<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f7f4" />
    <title>视频下载</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-video" viewBox="0 0 24 24">
        <path d="m16 13 5 3V8l-5 3" />
        <rect width="13" height="14" x="3" y="5" rx="2" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="m7 10 5 5 5-5" />
        <path d="M12 15V3" />
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </symbol>
      <symbol id="icon-clipboard" viewBox="0 0 24 24">
        <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </symbol>
      <symbol id="icon-log-out" viewBox="0 0 24 24">
        <path d="M10 17l5-5-5-5" />
        <path d="M15 12H3" />
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5" />
        <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5" />
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <rect width="6" height="6" x="9" y="9" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
        <polyline points="14 2 14 8 20 8" />
        <path d="m9 15 3 3 3-3" />
        <path d="M12 12v6" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1" />
        <path d="m9 11 3 3L22 4" />
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v5" />
        <path d="M14 11v5" />
      </symbol>
    </svg>

    <section class="login-view" id="loginView" aria-labelledby="loginTitle">
      <div class="login-brand" aria-hidden="true">
        <span class="brand-mark brand-mark-large">
          <svg class="icon"><use href="#icon-download"></use></svg>
        </span>
        <p>VIDEO</p>
      </div>
      <form class="login-panel" id="loginForm">
        <div class="login-heading">
          <span class="eyebrow">视频下载</span>
          <h1 id="loginTitle">登录</h1>
        </div>
        <label class="field">
          <span>用户名</span>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="form-message error-text" id="loginError" role="alert"></p>
        <button class="button button-primary button-full" id="loginButton" type="submit">
          <svg class="icon"><use href="#icon-lock"></use></svg>
          <span>登录</span>
        </button>
      </form>
    </section>

    <div class="app-view" id="appView" hidden>
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/" aria-label="视频下载首页">
            <span class="brand-mark">
              <svg class="icon"><use href="#icon-download"></use></svg>
            </span>
            <span>视频下载</span>
          </a>
          <div class="topbar-actions">
            <span class="service-state" id="serviceState">
              <span class="state-dot"></span>
              <span id="serviceStateText">连接中</span>
            </span>
            <button class="icon-button" id="logoutButton" type="button" aria-label="退出登录" title="退出登录">
              <svg class="icon"><use href="#icon-log-out"></use></svg>
            </button>
          </div>
        </div>
      </header>

      <main>
        <section class="download-band" aria-labelledby="pageTitle">
          <div class="content-width">
            <div class="section-heading download-heading">
              <div>
                <span class="eyebrow">单个视频</span>
                <h1 id="pageTitle">下载视频</h1>
              </div>
              <span class="version-label" id="versionLabel"></span>
            </div>

            <div class="download-tool">
              <form class="url-form" id="urlForm" novalidate>
                <label for="videoUrl">视频链接</label>
                <div class="url-controls">
                  <div class="url-input-wrap">
                    <svg class="icon url-icon"><use href="#icon-link"></use></svg>
                    <input
                      id="videoUrl"
                      name="videoUrl"
                      type="url"
                      inputmode="url"
                      autocomplete="url"
                      placeholder="https://..."
                      aria-describedby="urlMessage"
                      required
                    />
                    <button class="input-icon-button" id="pasteButton" type="button" aria-label="粘贴链接" title="粘贴链接">
                      <svg class="icon"><use href="#icon-clipboard"></use></svg>
                    </button>
                  </div>
                  <button class="button button-dark analyze-button" id="analyzeButton" type="submit">
                    <svg class="icon"><use href="#icon-search"></use></svg>
                    <span>解析视频</span>
                  </button>
                </div>
                <p class="form-message" id="urlMessage" role="status"></p>
              </form>

              <div class="preview" id="preview" hidden>
                <div class="preview-media" id="previewMedia">
                  <img id="previewImage" alt="" referrerpolicy="no-referrer" />
                  <div class="media-placeholder">
                    <svg class="icon"><use href="#icon-video"></use></svg>
                  </div>
                </div>
                <div class="preview-body">
                  <div class="preview-title-row">
                    <div>
                      <span class="source-label" id="previewSource">视频</span>
                      <h2 id="previewTitle">正在读取视频信息</h2>
                    </div>
                    <button class="icon-button icon-button-subtle" id="clearPreviewButton" type="button" aria-label="清除当前视频" title="清除当前视频">
                      <svg class="icon"><use href="#icon-x"></use></svg>
                    </button>
                  </div>
                  <div class="preview-meta" id="previewMeta"></div>
                  <p class="preview-message" id="previewMessage" role="status"></p>

                  <fieldset class="quality-fieldset" id="qualityFieldset">
                    <legend>清晰度</legend>
                    <div class="quality-control">
                      <label>
                        <input type="radio" name="quality" value="best" checked />
                        <span><strong>最佳</strong><small id="bestQualityNote">最高可用</small></span>
                      </label>
                      <label>
                        <input type="radio" name="quality" value="2160" />
                        <span><strong>4K</strong><small>2160P</small></span>
                      </label>
                      <label>
                        <input type="radio" name="quality" value="1080" />
                        <span><strong>高清</strong><small>1080P</small></span>
                      </label>
                      <label>
                        <input type="radio" name="quality" value="720" />
                        <span><strong>流畅</strong><small>720P</small></span>
                      </label>
                      <label>
                        <input type="radio" name="quality" value="480" />
                        <span><strong>省流</strong><small>480P</small></span>
                      </label>
                    </div>
                  </fieldset>

                  <button class="button button-primary download-button" id="downloadButton" type="button">
                    <svg class="icon"><use href="#icon-download"></use></svg>
                    <span>开始下载</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="activity-band" aria-labelledby="tasksTitle">
          <div class="content-width activity-grid">
            <div class="activity-section">
              <div class="section-heading compact-heading">
                <div class="heading-with-count">
                  <h2 id="tasksTitle">下载任务</h2>
                  <span class="count-badge" id="taskCount">0</span>
                </div>
                <button class="icon-button icon-button-subtle refresh-button" type="button" data-refresh aria-label="刷新任务" title="刷新任务">
                  <svg class="icon"><use href="#icon-refresh"></use></svg>
                </button>
              </div>
              <div class="task-list" id="taskList">
                <div class="empty-state">
                  <svg class="icon"><use href="#icon-clock"></use></svg>
                  <span>暂无下载任务</span>
                </div>
              </div>
            </div>

            <div class="activity-section files-section" aria-labelledby="filesTitle">
              <div class="section-heading compact-heading">
                <div class="heading-with-count">
                  <h2 id="filesTitle">已完成</h2>
                  <span class="count-badge" id="fileCount">0</span>
                </div>
                <button class="icon-button icon-button-subtle refresh-button" type="button" data-refresh aria-label="刷新文件" title="刷新文件">
                  <svg class="icon"><use href="#icon-refresh"></use></svg>
                </button>
              </div>
              <div class="file-list" id="fileList">
                <div class="empty-state">
                  <svg class="icon"><use href="#icon-file"></use></svg>
                  <span>暂无已完成文件</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="confirm-dialog" id="deleteDialog" aria-labelledby="deleteDialogTitle">
      <div class="confirm-dialog-body">
        <span class="dialog-icon" aria-hidden="true">
          <svg class="icon"><use href="#icon-trash"></use></svg>
        </span>
        <span class="eyebrow">服务器文件</span>
        <h2 id="deleteDialogTitle">确认删除</h2>
        <p class="dialog-copy">文件将从服务器永久删除：</p>
        <p class="dialog-file-name" id="deleteFileName"></p>
        <div class="dialog-actions">
          <button class="button button-secondary" id="deleteCancelButton" type="button">取消</button>
          <button class="button button-danger" id="deleteConfirmButton" type="button">
            <svg class="icon"><use href="#icon-trash"></use></svg>
            <span>确认删除</span>
          </button>
        </div>
      </div>
    </dialog>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
